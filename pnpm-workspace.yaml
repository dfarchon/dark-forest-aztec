packages:
  - bridge
  - client
  - contracts
  - server
  - packages/constants
  - packages/contracts
  - packages/events
  - packages/gamelogic
  - packages/hexgen
  - packages/hashing
  - packages/indexer-core
  - packages/serde
  - packages/utils
  - packages/types
  - packages/procedural
  - packages/renderer
  - packages/ui

# pnpm 11 config. Overrides moved here from package.json#pnpm.
autoInstallPeers: true
engineStrict: true
preferFrozenLockfile: true
lockfile: true
shamefullyHoist: false
confirmModulesPurge: false
strictDepBuilds: true
strictStorePkgContentCheck: true
verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
saveExact: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustLockfile: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
pmOnFail: error
publicHoistPattern:
  - "@aztec/*"

overrides:
  "@aws-sdk/client-s3": "3.1141.0"
  "@babel/core": "7.29.7"
  "@fastify/static": "10.1.5"
