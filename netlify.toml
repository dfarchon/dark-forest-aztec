[build]
  base = "."
  command = "pnpm install && pnpm --filter client build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24.12.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
